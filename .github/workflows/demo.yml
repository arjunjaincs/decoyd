# .github/workflows/demo.yml
# Runnable GitHub Actions demo workflow showcasing Decoyd Tier 1 detection
# against examples/demo-evil-pkg (requires workflow_dispatch or explicit call).

name: Decoyd Demo (Tier 1 npm Credential Access)

on:
  workflow_dispatch:
  push:
    branches:
      - 'batch/**'
    paths:
      - '.github/workflows/demo.yml'
      - 'examples/demo-evil-pkg/**'

permissions:
  contents: read

jobs:
  decoyd-demo:
    name: Decoyd Tier 1 credential-access demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "stable"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Build and install decoyd
        run: |
          go build -o /tmp/decoyd ./cmd/decoyd
          sudo install -m 0755 /tmp/decoyd /usr/local/bin/decoyd

      - name: Seed decoy credentials and deployed_tokens.json
        run: |
          DATA_DIR="$RUNNER_TEMP/decoyd-demo"
          mkdir -p "$DATA_DIR"
          echo "DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

          # Do not seed ~/.npmrc because npm itself reads ~/.npmrc on startup
          # (even under --ignore-scripts); seed credential files read only by postinstall.
          printf '[distutils]\nindex-servers = pypi\n[pypi]\nusername = __token__\npassword = pypi-%s\n' "$(openssl rand -hex 20)" > "$HOME/.pypirc"
          chmod 0600 "$HOME/.pypirc"

          printf 'hvs.%s\n' "$(openssl rand -hex 20)" > "$HOME/.vault-token"
          chmod 0600 "$HOME/.vault-token"

          OWNER_UID="$(id -u)"
          cat <<EOF > "$DATA_DIR/deployed_tokens.json"
          [
            {
              "id": "demo-pypirc-tok2",
              "type": "pypirc",
              "deployed_path": "$HOME/.pypirc",
              "owner_uid": $OWNER_UID
            },
            {
              "id": "demo-vault-tok3",
              "type": "vault_token",
              "deployed_path": "$HOME/.vault-token",
              "owner_uid": $OWNER_UID
            }
          ]
          EOF
          chmod 0600 "$DATA_DIR/deployed_tokens.json"

      - name: Start decoyd watch (Tier 1)
        run: |
          sudo -E sh -c 'exec /usr/local/bin/decoyd watch --tier1 --data-dir "$1" > /tmp/decoyd-demo-watch.log 2>&1' _ "$DATA_DIR" &
          ready=0
          for i in $(seq 1 30); do
            if grep -q "decoyd watch started" /tmp/decoyd-demo-watch.log 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          cat /tmp/decoyd-demo-watch.log || true
          test "$ready" -eq 1
          grep -q "monitoring 2 tokens" /tmp/decoyd-demo-watch.log

      - name: Negative control (npm install --ignore-scripts produces 0 events)
        run: |
          mkdir -p "$RUNNER_TEMP/demo-pkg-neg"
          cd "$RUNNER_TEMP/demo-pkg-neg"
          npm install --no-save --ignore-scripts "$GITHUB_WORKSPACE/examples/demo-evil-pkg"
          sleep 2.6
          if sudo test -s "$DATA_DIR/triggers.jsonl"; then
            echo "ERROR: expected 0 events under --ignore-scripts, got:"
            sudo cat "$DATA_DIR/triggers.jsonl"
            exit 1
          fi
          echo "Negative control passed: 0 events under npm install --ignore-scripts."

      - name: Install examples/demo-evil-pkg (triggers postinstall credential read)
        run: |
          mkdir -p "$RUNNER_TEMP/demo-pkg-install"
          cd "$RUNNER_TEMP/demo-pkg-install"
          npm install --no-save "$GITHUB_WORKSPACE/examples/demo-evil-pkg"

      - name: Assert attributed Tier 1 event and exit code 3
        run: |
          found=0
          for i in $(seq 1 50); do
            if sudo test -f "$DATA_DIR/triggers.jsonl" && sudo grep -q "demo-evil-pkg" "$DATA_DIR/triggers.jsonl"; then
              found=1
              break
            fi
            sleep 0.2
          done
          test "$found" -eq 1

          echo "=== decoyd events --json ==="
          sudo /usr/local/bin/decoyd events --json --data-dir "$DATA_DIR" | tee "$RUNNER_TEMP/demo-events.json"

          python3 - "$RUNNER_TEMP/demo-events.json" <<'PY'
          import json, sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              events = json.load(f)

          matched = []
          for ev in events:
              attr = ev.get("attribution") or {}
              if (
                  ev.get("watcher_tier") == "tier1"
                  and attr.get("npm_package") == "demo-evil-pkg"
                  and attr.get("npm_lifecycle_event") == "postinstall"
              ):
                  matched.append(ev)

          assert matched, f"No Tier 1 event with npm_package=demo-evil-pkg and npm_lifecycle_event=postinstall in {events}"
          best = [e for e in matched if (e.get("attribution") or {}).get("confidence") == 3]
          assert best, f"Expected confidence == 3 attribution, got {matched}"
          print("Matched Tier 1 event:", json.dumps(best[0], indent=2))
          PY

          RESULT=0
          sudo /usr/local/bin/decoyd events --fail-if-any --data-dir "$DATA_DIR" || RESULT=$?
          echo "decoyd events --fail-if-any exit code: $RESULT"
          if [ "$RESULT" -eq 3 ]; then
            echo "SUCCESS: Decoyd Tier 1 detected credential access (exit 3)."
            exit 0
          fi
          echo "FAIL: expected exit code 3, got $RESULT"
          exit 1

      - name: Upload demo events artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-events
          path: |
            ${{ runner.temp }}/demo-events.json
            /tmp/decoyd-demo-watch.log
          if-no-files-found: ignore

      - name: Stop decoyd watcher
        if: always()
        run: |
          sudo pkill -TERM -f '/usr/local/bin/decoyd watch --tier1' || true
          cat /tmp/decoyd-demo-watch.log || true
