# UNVALIDATED: not run through sigma-cli or pySigma against a real SIEM.
# Validate with: sigma check decoyd.yml  (sigma-cli 0.x)
title: Decoyd Credential Decoy File Access
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: >
  Detects access to credential decoy files deployed by Decoyd.
  Decoyd writes structured JSON events (triggers.jsonl) whenever a
  watched decoy file is opened or read.
references:
  - https://github.com/arjunjaincs/decoyd
  - https://attack.mitre.org/techniques/T1552/001/
author: Decoyd project
date: 2026-11-10
tags:
  - attack.credential_access
  - attack.t1552.001
  - attack.collection
  - attack.t1005
logsource:
  product: decoyd
  service: triggers
detection:
  selection:
    schema_version: 1
  filter_self:
    # Exclude events generated by the Decoyd self-test command
    process.comm: 'decoyd'
  condition: selection and not filter_self
fields:
  - token_name
  - token_id
  - trigger_at
  - watcher_tier
  - process.pid
  - process.exe
  - process.cmdline
  - package.name
  - package.version
  - package.confidence
falsepositives:
  - Backup agents scanning credential files
  - Security scanners with legitimate access
  - User explicitly running credential helpers (expected)
level: high
---
# Second rule: high-confidence supply-chain attribution
title: Decoyd Supply-Chain Package Credential Theft (High Confidence)
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: >
  Decoyd detected a credential decoy access with HIGH confidence attribution
  to an npm/pip package lifecycle event. Likely indicates a malicious
  install-time script reading credential files.
references:
  - https://github.com/arjunjaincs/decoyd
  - https://attack.mitre.org/techniques/T1195/002/
author: Decoyd project
date: 2026-11-10
tags:
  - attack.initial_access
  - attack.t1195.002
  - attack.credential_access
  - attack.t1552.001
logsource:
  product: decoyd
  service: triggers
detection:
  selection:
    schema_version: 1
    package.confidence: 'high'
  condition: selection
fields:
  - token_name
  - package.name
  - package.version
  - package.confidence
  - process.exe
  - process.cmdline
falsepositives:
  - Unlikely; high confidence requires npm lifecycle event in environment
level: critical
