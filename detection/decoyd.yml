# Status: syntax-checked (PyYAML), untested (sigma-cli / pySigma unavailable locally without pip/ensurepip; not tested against a real SIEM).
# Validate with: pip install sigma-cli && sigma check detection/decoyd.yml
title: Decoyd Credential Decoy File Access
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: >
  Detects access to credential decoy files deployed by Decoyd.
  Decoyd writes structured JSON events (triggers.jsonl) whenever a
  watched decoy file is opened, accessed, written, renamed, or deleted.
references:
  - https://github.com/arjunjaincs/decoyd
  - https://attack.mitre.org/techniques/T1552/001/
author: Decoyd project
date: 2026-11-11
tags:
  - attack.credential_access
  - attack.t1552.001
  - attack.collection
  - attack.t1005
logsource:
  product: decoyd
  service: triggers
detection:
  selection:
    token_id|exists: true
    event_type:
      - 'access'
      - 'write'
      - 'rename'
      - 'delete'
  filter_self:
    # Exclude events generated by the Decoyd self-test binary invocation
    attribution.accessor.comm: 'decoyd'
  condition: selection and not filter_self
fields:
  - id
  - token_id
  - token_type
  - path
  - triggered_at
  - event_type
  - status
  - watcher_tier
  - attribution.accessor.pid
  - attribution.accessor.exe
  - attribution.accessor.cmdline
  - attribution.confidence
  - attribution.npm_package
  - attribution.npm_version
  - attribution.npm_lifecycle_event
falsepositives:
  - Backup agents scanning credential files
  - Security scanners with legitimate access
  - User explicitly running credential helpers
level: high
---
# Status: syntax-checked (PyYAML), untested (sigma-cli / pySigma unavailable locally without pip/ensurepip; not tested against a real SIEM).
title: Decoyd Supply-Chain npm Package Credential Access
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: >
  Detects access to a credential decoy file during an npm lifecycle script
  where Tier 1 attribution captured npm_package_name and npm_lifecycle_event
  from /proc/<pid>/environ.
references:
  - https://github.com/arjunjaincs/decoyd
  - https://attack.mitre.org/techniques/T1195/002/
author: Decoyd project
date: 2026-11-11
tags:
  - attack.initial_access
  - attack.t1195.002
  - attack.credential_access
  - attack.t1552.001
logsource:
  product: decoyd
  service: triggers
detection:
  selection:
    watcher_tier: 'tier1'
    attribution.npm_package|exists: true
    attribution.npm_lifecycle_event:
      - 'preinstall'
      - 'install'
      - 'postinstall'
      - 'prepare'
  condition: selection
fields:
  - token_id
  - token_type
  - path
  - attribution.accessor.pid
  - attribution.accessor.exe
  - attribution.accessor.cmdline
  - attribution.confidence
  - attribution.npm_package
  - attribution.npm_version
  - attribution.npm_lifecycle_event
falsepositives:
  - Benign local test packages such as examples/demo-evil-pkg
level: critical
